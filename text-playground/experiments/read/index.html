<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尾巴即阅读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="/src/style.css">
<style>.wrap{max-width:820px}</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Text playground</a>
  <header>
    <p class="eyebrow">05 · Reading · hit-test along a path</p>
    <h1>尾巴即阅读</h1>
    <p class="lede">整首诗都在尾巴上，一圈圈绕下去，越往下越细。用手指或鼠标从尾巴根部往下读，读过的字会变红，老鼠嘴里念的是你正读到的那一行。</p>
  </header>

  <div class="bar">
    <button class="plain" id="reset" type="button">从头再读</button>
    <label class="switch" for="edge"><input type="checkbox" id="edge"><span class="track" aria-hidden="true"></span><span>轮廓线</span></label>
  </div>

  <div class="sheet">
    <canvas class="stage" id="stage" role="img" aria-label="一只老鼠，尾巴是整首诗，沿折返线一圈圈绕下去。沿着尾巴移动指针来阅读，读完最后一个词，尾巴会断开，字母掉下去堆在底部。"></canvas>
    <p class="readout"><span id="r-line">–</span><span id="r-chars">–</span></p>
  </div>
  <p class="hint">只能接着读，不能跳：指针要落在已读部分往后几个字以内才算数。小红点标着下一个该读的字。读到最后一个词时，你就知道会发生什么了。</p>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
