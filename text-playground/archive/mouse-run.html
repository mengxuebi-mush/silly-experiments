    <h1>会跑的老鼠尾巴</h1>

    var a=anchorWorld(),dx=a.x-S.ptr.x,dy=a.y-S.ptr.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
    var ux=dx/dd,uy=dy/dd;
    S.vx+=ux*1100*dt;S.vy+=uy*1100*dt;
    var sp=Math.sqrt(S.vx*S.vx+S.vy*S.vy);if(sp>300){S.vx*=300/sp;S.vy*=300/sp;}
    var maxD=S.held*L*1.0;
    if(dd>maxD){var over=dd-maxD;S.x-=ux*over;S.y-=uy*over;
      var vn=S.vx*ux+S.vy*uy;if(vn>0){S.vx-=ux*vn;S.vy-=uy*vn;}
      if(!reduce){S.x+=(Math.random()-.5)*2.4;S.y+=(Math.random()-.5)*2.4;}}
  }else if(S.mode==='flee'){
    S.fleeT-=dt;S.vx*=Math.exp(-1.1*dt);S.vy*=Math.exp(-1.1*dt);
    if(S.fleeT<=0)S.mode='idle';
  }else{
    S.vx+=((h.x-S.x)*14-S.vx*6.2)*dt;S.vy+=((h.y-S.y)*14-S.vy*6.2)*dt;
  }
  S.x+=S.vx*dt;S.y+=S.vy*dt;
  if(S.x<bx0){S.x=bx0;S.vx=Math.abs(S.vx)*.8;}
  if(S.x>bx1){S.x=bx1;S.vx=-Math.abs(S.vx)*.8;}
  if(S.y<by0){S.y=by0;S.vy=Math.abs(S.vy)*.8;}
  if(S.y>by1){S.y=by1;S.vy=-Math.abs(S.vy)*.8;}
  var speed=Math.sqrt(S.vx*S.vx+S.vy*S.vy),wasFlip=S.flip;
  if(Math.abs(S.vx)>40)S.flip=S.vx>0;
  else if(S.mode==='idle'&&speed<12&&Math.abs(S.x-h.x)<3)S.flip=false;
  if(S.flip!==wasFlip)resetRope();
  S.bob=speed>40&&!reduce?Math.sin(t*34)*Math.min(1.8,speed/160):0;
}

/* ---------- drawing ---------- */
function wordWidth(w){var v=S.wordW.get(w);if(v===undefined){v=ctx.measureText(w).width;S.wordW.set(w,v);}return v;}

function drawBody(lines,doneAll){
  var s=S.size;ctx.font=fontOf(s);ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=S.ink;
  var yb=S.bob||0;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i],words=ln.text.split(' '),n=words.length-1,extra=ln.avail-ln.w,y=ln.y+yb;
    var justify=n>=1&&extra/n<=s*.9&&!(doneAll&&i===lines.length-1);
    if(!justify){ctx.fillText(ln.text,ln.x,y);continue;}
    var gap=extra/n,x=ln.x;
    for(var j=0;j<words.length;j++){ctx.fillText(words[j],x,y);x+=wordWidth(words[j])+S.spaceW+gap;}
  }
}

var cw10=new Map();
function charW(ch){var v=cw10.get(ch);if(v===undefined){ctx.font=fontOf(10);v=ctx.measureText(ch).width/10;cw10.set(ch,v);}return v;}

function drawTail(str){
  if(!str)return;
  var cum=[0],i,total=0;
  for(i=1;i<N;i++){total+=Math.hypot(rx[i]-rx[i-1],ry[i]-ry[i-1]);cum.push(total);}
  function at(s){
    var k=1;while(k<N-1&&cum[k]<s)k++;
    var seg=cum[k]-cum[k-1]||1,u=(s-cum[k-1])/seg;
    return{x:rx[k-1]+(rx[k]-rx[k-1])*u,y:ry[k-1]+(ry[k]-ry[k-1])*u,a:Math.atan2(ry[k]-ry[k-1],rx[k]-rx[k-1])};
  }
  var chars=Array.from(str),yb=S.bob||0;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=S.ink;
  var s=S.flip?total:0,dir=S.flip?-1:1;
  for(i=0;i<chars.length;i++){
    var frac=Math.min(1,Math.max(0,s/total)),size=Math.max(6,13.5-7.5*frac),w=charW(chars[i])*size;
    var mid=s+dir*w/2;
    if(mid<0||mid>total)break;
    if(chars[i]!==' '){
      var p=at(mid);
      ctx.save();ctx.translate(p.x,p.y+yb);ctx.rotate(S.flip?p.a+Math.PI:p.a);
      ctx.font=fontOf(size);ctx.fillText(chars[i],0,0);ctx.restore();
    }
    s+=dir*w;
  }
}

function drawEdges(){
  var sh=SHAPES[S.shape];
  ctx.save();ctx.translate(S.x,S.y+(S.bob||0));
  if(S.flip){ctx.translate(sh.bw,0);ctx.scale(-1,1);}
  ctx.strokeStyle=S.guide;ctx.globalAlpha=.8;ctx.lineWidth=1.2;ctx.stroke(sh.path);
  ctx.beginPath();sh.holes.forEach(function(h){ctx.moveTo(h[0]+h[2],h[1]);ctx.arc(h[0],h[1],h[2],0,6.2832);});
  if(S.shape==='cheese')S.bites.forEach(function(b){ctx.moveTo(b[0]+b[2],b[1]);ctx.arc(b[0],b[1],b[2],0,6.2832);});
  ctx.stroke();ctx.restore();
  if(SHAPES[S.shape].tail){
    ctx.save();ctx.globalAlpha=.7;ctx.strokeStyle=S.guide;ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(rx[0],ry[0]);for(var i=1;i<N;i++)ctx.lineTo(rx[i],ry[i]);ctx.stroke();ctx.restore();
  }
}

/* ---------- loop ---------- */
var last=0,acc=0,frames=0,msSum=0,lastTheme=0;
function readTheme(now){
  if(now-lastTheme<400)return;lastTheme=now;
  var cs=getComputedStyle(document.documentElement);
  S.ink=cs.getPropertyValue('--ink').trim()||S.ink;S.guide=cs.getPropertyValue('--guide').trim()||S.guide;S.soft=cs.getPropertyValue('--ink-soft').trim()||S.soft;
}
function sizeCanvas(){
  var r=canvas.getBoundingClientRect();if(!r.width)return;
  dpr=Math.min(2,window.devicePixelRatio||1);
  var cw=Math.round(r.width*dpr),ch=Math.round(cw*H/W);
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
  scale=canvas.width/W;
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.033,(now-last)/1000||.016);last=now;
  readTheme(now);sizeCanvas();
  var t0=performance.now();
  var sh=SHAPES[S.shape];
  /* pointer velocity decay, smoothed cursor hole */
  S.ptr.hx+=(S.ptr.x-S.ptr.hx)*.4;S.ptr.hy+=(S.ptr.y-S.ptr.hy)*.4;
  updateBody(dt,now/1000);
  if(sh.tail)updateRope(dt,now/1000);
  S.ptr.vx*=.8;S.ptr.vy*=.8;
  var data=paintMask(true),s=S.size,res=layoutBody(data,S.prep,s,s*1.3);
  ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,W,H);
  if(S.edge)drawEdges();
  drawBody(res.lines,res.done);
  if(sh.tail&&!res.done)drawTail(remainder(S.prep,res.cur));
  if(S.held>0){ctx.beginPath();ctx.arc(rx[S.held],ry[S.held],7,0,6.2832);ctx.strokeStyle=S.guide;ctx.lineWidth=1.5;ctx.stroke();}
  msSum+=performance.now()-t0;frames++;acc+=dt;
  if(acc>.3){
    $('#r-layout').textContent='layoutNextLine × '+res.count+' / frame · '+(msSum/frames).toFixed(1)+' ms';
    acc=0;frames=0;msSum=0;
  }
  $('#r-size').textContent=S.shape+' · '+S.style+' · type '+S.size.toFixed(1)+'px · '+(S.prep.segments.length)+' segments';
}

/* ---------- input ---------- */
function toLogical(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function nearestRope(p){
  if(!SHAPES[S.shape].tail)return -1;
  var best=-1,bd=24;
  for(var i=3;i<N;i++){var d=Math.hypot(rx[i]-p.x,ry[i]-p.y);if(d<bd){bd=d;best=i;}}
  return best;
}
canvas.addEventListener('pointermove',function(e){
  var p=toLogical(e);
  S.ptr.vx=Math.max(-30,Math.min(30,p.x-S.ptr.x));S.ptr.vy=Math.max(-30,Math.min(30,p.y-S.ptr.y));
  if(!S.ptr.on){S.ptr.hx=p.x;S.ptr.hy=p.y;}
  S.ptr.x=p.x;S.ptr.y=p.y;S.ptr.on=true;
  if(S.held<0)canvas.style.cursor=nearestRope(p)>0?'grab':(S.shape==='cheese'?'crosshair':'default');
});
canvas.addEventListener('pointerleave',function(){if(S.held<0)S.ptr.on=false;});
canvas.addEventListener('pointerdown',function(e){
  var p=toLogical(e);S.ptr.x=S.ptr.hx=p.x;S.ptr.y=S.ptr.hy=p.y;S.ptr.vx=S.ptr.vy=0;S.ptr.on=true;
  var i=nearestRope(p);
  if(i>0){
    S.held=i;S.mode='held';S.vx=S.vy=0;
    canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';e.preventDefault();return;
  }
  if(S.shape==='cheese'&&S.bites.length<16){
    var sh=SHAPES.cheese,lx=p.x-S.x,ly=p.y-S.y;
    if(lx>-6&&lx<sh.bw+6&&ly>-6&&ly<sh.bh+6)S.bites.push([lx,ly,16+Math.random()*12]);
  }
});
function release(e){
  if(S.held<0)return;
  var a=anchorWorld(),dx=a.x-S.ptr.x,dy=a.y-S.ptr.y,dd=Math.hypot(dx,dy)||1;
  S.held=-1;S.mode='flee';S.fleeT=1.5;
  S.vx=dx/dd*620;S.vy=dy/dd*620;
  try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
  canvas.style.cursor='default';
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

function setPressed(seg,v){Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false');});}
function applyHint(){$('#hint').textContent=SHAPES[S.shape].hint;$('#reset').hidden=S.shape!=='cheese';}
$('#seg-shape').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  S.shape=b.dataset.v;S.bites=[];setPressed(this,S.shape);applyHint();fit();});
$('#seg-style').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  S.style=b.dataset.v;setPressed(this,S.style);
  var edge=$('#edge');if(S.style==='ring'&&!edge.checked){edge.checked=true;S.edge=true;}
  fit();});
$('#edge').addEventListener('change',function(){S.edge=this.checked;});
$('#reset').addEventListener('click',function(){S.bites=[];fit();});

/* ---------- boot ---------- */
var started=false;
function start(){
  if(started)return;started=true;
  applyHint();sizeCanvas();readTheme(0);fit();requestAnimationFrame(frame);
}
var loaded=false;
Promise.race([
  document.fonts.load('400 20px "Libre Caslon Text"').then(function(){loaded=true;}),
  new Promise(function(r){setTimeout(r,2500);})
]).then(start,start);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){
  if(started&&!loaded){loaded=true;clearCache();cw10.clear();fit();}
});
})();
</script>
