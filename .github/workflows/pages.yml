# Builds every experiment and publishes them together on GitHub Pages:
#   /                  index.html at the repo root
#   /<experiment>/     the experiment's dist/ if it has a package.json, else the folder as is
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build experiments
        run: |
          mkdir -p _site
          cp index.html _site/
          for dir in */; do
            name=${dir%/}
            if [ -f "$name/package.json" ]; then
              (cd "$name" && npm ci && npm run build)
              cp -R "$name/dist" "_site/$name"
            elif [ -f "$name/index.html" ]; then
              mkdir -p "_site/$name"
              rsync -a --exclude README.md --exclude CLAUDE.md "$name/" "_site/$name/"
            fi
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
